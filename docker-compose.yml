# Stand up the portfolio with `docker compose up -d --build`.
#
# The `web` service serves the static export over HTTP :80 inside the
# container. It does NOT publish any host ports by default — ingress
# comes from whatever reverse proxy / tunnel you already run
# (Cloudflare Tunnel, an existing Caddy, Traefik, nginx, …).
#
# Required config (in a .env file next to this compose file):
#
#   NEXT_PUBLIC_SITE_URL=https://portfolio.your-domain.com
#
# After the container is up, attach your reverse proxy / tunnel to the
# `portfolio` network so it can reach the container at `http://web:80`:
#
#   docker network connect portfolio <your-tunnel-or-proxy-container>

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://localhost}
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - portfolio

networks:
  portfolio:
    name: portfolio
